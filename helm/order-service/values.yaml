replicaCount: 1

image:
  repository: anmolk992/order-service
  tag: main-2026-07-18-e64a9d1
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8082

env:
  spring:
    datasource:
      url: jdbc:mysql://mysql:3306/shop
      username: app
      password: app

db:
  host: mysql

probes:
  startup:
    enabled: true
    path: /actuator/health
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5

  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "500m"
